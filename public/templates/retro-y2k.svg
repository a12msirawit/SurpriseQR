<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&amp;family=Prompt:wght@600;700&amp;display=swap');
    </style>
    <linearGradient id="winTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000080" />
      <stop offset="100%" stop-color="#1084d0" />
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Desktop Teal Background -->
  <rect width="480" height="720" fill="#008080" />
  <rect width="480" height="720" fill="url(#scanlines)" />

  <!-- Desktop Icons (Left) -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#ffffff" opacity="0.15" />
    <text x="18" y="24" text-anchor="middle" font-size="20">💾</text>
    <text x="18" y="46" text-anchor="middle" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold">Surprise</text>
  </g>
  <g transform="translate(24, 88)">
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#ffffff" opacity="0.15" />
    <text x="18" y="24" text-anchor="middle" font-size="20">📝</text>
    <text x="18" y="46" text-anchor="middle" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold">Letter.txt</text>
  </g>
  <g transform="translate(24, 148)">
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#ffffff" opacity="0.15" />
    <text x="18" y="24" text-anchor="middle" font-size="20">⚡</text>
    <text x="18" y="46" text-anchor="middle" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold">Winamp</text>
  </g>

  <!-- Main 98 Window: SYSTEM ALERT -->
  <g transform="translate(48, 110)">
    <!-- Window Outer Raised Bevel Frame -->
    <rect x="0" y="0" width="384" height="230" fill="#c0c0c0" stroke="#ffffff" stroke-width="2" />
    <path d="M 384 0 L 384 230 L 0 230" stroke="#000000" stroke-width="3" fill="none" />
    <path d="M 382 2 L 382 228 L 2 228" stroke="#808080" stroke-width="2" fill="none" />

    <!-- Window Title Bar -->
    <rect x="4" y="4" width="376" height="24" fill="url(#winTitle)" />
    <text x="12" y="21" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="12" font-weight="bold">⚠️ Heartbeat Overload.exe</text>

    <!-- Title Bar Buttons [ _ ] [ □ ] [ X ] -->
    <g transform="translate(324, 8)">
      <rect x="0" y="0" width="14" height="14" fill="#c0c0c0" stroke="#ffffff" stroke-width="1"/>
      <path d="M14 0 L14 14 L0 14" stroke="#000000" stroke-width="1"/>
      <text x="7" y="10" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9" font-weight="bold">_</text>

      <rect x="17" y="0" width="14" height="14" fill="#c0c0c0" stroke="#ffffff" stroke-width="1"/>
      <path d="M31 0 L31 14 L17 14" stroke="#000000" stroke-width="1"/>
      <text x="24" y="11" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9" font-weight="bold">□</text>

      <rect x="34" y="0" width="14" height="14" fill="#c0c0c0" stroke="#ffffff" stroke-width="1"/>
      <path d="M48 0 L48 14 L34 14" stroke="#000000" stroke-width="1"/>
      <text x="41" y="11" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9" font-weight="bold">✕</text>
    </g>

    <!-- Warning Icon & Alert Content -->
    <g transform="translate(20, 48)">
      <!-- 90s Warning Triangle -->
      <polygon points="26,10 5,46 47,46" fill="#fce043" stroke="#000000" stroke-width="2" />
      <text x="26" y="42" text-anchor="middle" fill="#000000" font-family="'Courier Prime', monospace" font-size="26" font-weight="bold">!</text>

      <!-- Message Text -->
      <text x="64" y="24" fill="#000080" font-family="'Courier Prime', monospace" font-size="12" font-weight="bold">CRITICAL EXCEPTION 0x98_LOVE</text>
      <text x="64" y="44" fill="#111111" font-family="'Prompt', sans-serif" font-size="12" font-weight="600">ตรวจพบความรู้สึกพิเศษเกินขนาดใน C:\</text>
      <text x="64" y="62" fill="#333333" font-family="'Prompt', sans-serif" font-size="11">ต้องการเปิดอ่านข้อความเซอร์ไพรส์หรือไม่?</text>
    </g>

    <!-- Buttons at Bottom: Yes and Cancel -->
    <g transform="translate(190, 160)">
      <!-- Yes Button (Primary raised) -->
      <rect x="0" y="0" width="80" height="28" fill="#c0c0c0" stroke="#ffffff" stroke-width="2" />
      <path d="M 80 0 L 80 28 L 0 28" stroke="#000000" stroke-width="2" fill="none" />
      <rect x="2" y="2" width="76" height="24" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="1 1"/>
      <text x="40" y="18" text-anchor="middle" fill="#000000" font-family="'Courier Prime', monospace" font-size="12" font-weight="bold">Yes (Y)</text>

      <!-- Cancel Runaway Button -->
      <rect x="94" y="0" width="80" height="28" fill="#c0c0c0" stroke="#ffffff" stroke-width="2" />
      <path d="M 174 0 L 174 28 L 94 28" stroke="#000000" stroke-width="2" fill="none" />
      <text x="134" y="18" text-anchor="middle" fill="#000000" font-family="'Courier Prime', monospace" font-size="12">Cancel</text>
    </g>

    <!-- Status Bar (Sunken) -->
    <rect x="4" y="202" width="376" height="22" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <path d="M 380 202 L 380 224 L 4 224" stroke="#ffffff" stroke-width="1" fill="none"/>
    <text x="10" y="217" fill="#444444" font-family="'Courier Prime', monospace" font-size="10">Status: 100% capacity filled with love</text>
  </g>

  <!-- Secondary 98 Window: Winamp 2.91 -->
  <g transform="translate(68, 370)">
    <!-- Winamp Player Frame -->
    <rect x="0" y="0" width="344" height="240" fill="#24242c" stroke="#5f5f6b" stroke-width="2"/>
    <path d="M 344 0 L 344 240 L 0 240" stroke="#000000" stroke-width="2" fill="none"/>

    <!-- Winamp Title -->
    <rect x="3" y="3" width="338" height="20" fill="url(#winTitle)"/>
    <text x="10" y="17" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="11" font-weight="bold">WINAMP - 1. Love_Track.mp3</text>
    <text x="306" y="17" fill="#00ffff" font-family="'Courier Prime', monospace" font-size="9">v2.91</text>

    <!-- Spectrum Display (Black Sunken Screen) -->
    <rect x="10" y="30" width="324" height="90" fill="#000000" stroke="#0a0a0f" stroke-width="2"/>
    <path d="M 334 30 L 334 120 L 10 120" stroke="#444455" stroke-width="1" fill="none"/>

    <text x="20" y="52" fill="#00ff66" font-family="'Courier Prime', monospace" font-size="16" font-weight="bold">01:42</text>
    <text x="120" y="50" fill="#00ff66" font-family="'Courier Prime', monospace" font-size="10">Our Special Melody</text>
    <text x="270" y="50" fill="#00e5ff" font-family="'Courier Prime', monospace" font-size="9">192 kbps</text>

    <!-- Equalizer Spectrum Bars -->
    <g transform="translate(20, 64)">
      <rect x="0" y="24" width="12" height="24" fill="#00ff66"/>
      <rect x="18" y="10" width="12" height="38" fill="#ffff00"/>
      <rect x="36" y="4" width="12" height="44" fill="#ff0055"/>
      <rect x="54" y="16" width="12" height="32" fill="#ffff00"/>
      <rect x="72" y="8" width="12" height="40" fill="#ff0055"/>
      <rect x="90" y="2" width="12" height="46" fill="#ff0055"/>
      <rect x="108" y="20" width="12" height="28" fill="#00ff66"/>
      <rect x="126" y="12" width="12" height="36" fill="#ffff00"/>
      <rect x="144" y="6" width="12" height="42" fill="#ff0055"/>
      <rect x="162" y="18" width="12" height="30" fill="#00ff66"/>
      <rect x="180" y="10" width="12" height="38" fill="#ffff00"/>
      <rect x="198" y="24" width="12" height="24" fill="#00ff66"/>
      <rect x="216" y="8" width="12" height="40" fill="#ff0055"/>
      <rect x="234" y="14" width="12" height="34" fill="#ffff00"/>
      <rect x="252" y="22" width="12" height="26" fill="#00ff66"/>
      <rect x="270" y="16" width="12" height="32" fill="#00ff66"/>
      <rect x="288" y="28" width="12" height="20" fill="#00ff66"/>
    </g>

    <!-- Winamp Player Buttons -->
    <g transform="translate(10, 132)">
      <rect x="0" y="0" width="70" height="24" fill="#444455" stroke="#777788" stroke-width="1"/>
      <path d="M 70 0 L 70 24 L 0 24" stroke="#000000" stroke-width="1" fill="none"/>
      <text x="35" y="16" text-anchor="middle" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="10" font-weight="bold">❚❚ PAUSE</text>

      <rect x="76" y="0" width="55" height="24" fill="#444455" stroke="#777788" stroke-width="1"/>
      <path d="M 131 0 L 131 24 L 76 24" stroke="#000000" stroke-width="1" fill="none"/>
      <text x="103" y="16" text-anchor="middle" fill="#ffffff" font-family="'Courier Prime', monospace" font-size="10">■ STOP</text>
    </g>

    <!-- Pixel Heart ASCII & Y2K Badge -->
    <g transform="translate(10, 170)">
      <rect x="0" y="0" width="324" height="58" fill="#181820" stroke="#333344" stroke-width="1"/>
      <text x="162" y="24" text-anchor="middle" fill="#ff3388" font-family="'Courier Prime', monospace" font-size="13" font-weight="bold">&lt;3 &lt;3 RETRO Y2K EDITION &lt;3 &lt;3</text>
      <text x="162" y="44" text-anchor="middle" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="11">ประสบการณ์เซอร์ไพรส์สไตล์ยุค 90s</text>
    </g>
  </g>

  <!-- Windows 98 Taskbar (Bottom) -->
  <g transform="translate(0, 684)">
    <rect x="0" y="0" width="480" height="36" fill="#c0c0c0" stroke="#ffffff" stroke-width="2"/>
    <path d="M 480 0 L 480 36 L 0 36" stroke="#000000" stroke-width="2" fill="none"/>

    <!-- Start Button (Raised) -->
    <g transform="translate(6, 5)">
      <rect x="0" y="0" width="76" height="26" fill="#c0c0c0" stroke="#ffffff" stroke-width="2"/>
      <path d="M 76 0 L 76 26 L 0 26" stroke="#000000" stroke-width="2" fill="none"/>
      <text x="10" y="18" font-size="14">🪟</text>
      <text x="32" y="18" fill="#000000" font-family="'Courier Prime', monospace" font-size="12" font-weight="bold">Start</text>
    </g>

    <!-- Active Taskbar Item (Sunken) -->
    <g transform="translate(88, 5)">
      <rect x="0" y="0" width="170" height="26" fill="#b0b0b0" stroke="#000000" stroke-width="1"/>
      <path d="M 170 0 L 170 26 L 0 26" stroke="#ffffff" stroke-width="1" fill="none"/>
      <text x="8" y="18" font-size="12">⚠️</text>
      <text x="26" y="18" fill="#000000" font-family="'Courier Prime', monospace" font-size="10" font-weight="bold">Heartbeat Overload</text>
    </g>

    <!-- System Tray (Sunken) -->
    <g transform="translate(400, 7)">
      <rect x="0" y="0" width="72" height="22" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
      <path d="M 72 0 L 72 22 L 0 22" stroke="#ffffff" stroke-width="1" fill="none"/>
      <text x="6" y="15" font-size="10">🔊</text>
      <text x="24" y="15" fill="#000000" font-family="'Courier Prime', monospace" font-size="10">11:11 PM</text>
    </g>
  </g>
</svg>

