<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="400" y1="0" x2="400" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b1e"/>
      <stop offset="55%" stop-color="#17163c"/>
      <stop offset="100%" stop-color="#080a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket" x1="170" y1="180" x2="630" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221933"/>
      <stop offset="50%" stop-color="#19132a"/>
      <stop offset="100%" stop-color="#130f22"/>
    </linearGradient>
    <linearGradient id="gold" x1="220" y1="220" x2="580" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- Fireworks -->
  <g stroke="#fbbf24" stroke-linecap="round" opacity="0.72">
    <line x1="150" y1="115" x2="150" y2="82" stroke-width="2.5"/>
    <line x1="150" y1="115" x2="180" y2="98" stroke-width="2"/>
    <line x1="150" y1="115" x2="174" y2="140" stroke-width="2"/>
    <line x1="150" y1="115" x2="126" y2="140" stroke-width="2"/>
    <line x1="150" y1="115" x2="120" y2="98" stroke-width="2"/>
  </g>
  <g stroke="#fde68a" stroke-linecap="round" opacity="0.65">
    <line x1="655" y1="130" x2="655" y2="94" stroke-width="2.5"/>
    <line x1="655" y1="130" x2="688" y2="113" stroke-width="2"/>
    <line x1="655" y1="130" x2="680" y2="156" stroke-width="2"/>
    <line x1="655" y1="130" x2="630" y2="156" stroke-width="2"/>
    <line x1="655" y1="130" x2="622" y2="113" stroke-width="2"/>
  </g>
  <!-- Stars -->
  <circle cx="290" cy="86" r="2.2" fill="#fef3c7" opacity="0.75"/>
  <circle cx="520" cy="100" r="2" fill="#fde68a" opacity="0.65"/>
  <circle cx="110" cy="430" r="2.2" fill="#fde68a" opacity="0.5"/>
  <circle cx="705" cy="410" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <!-- Golden Railway Ticket Card -->
  <rect x="160" y="170" width="480" height="255" rx="22" fill="url(#ticket)" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="174" y="184" width="452" height="227" rx="14" stroke="#fbbf24" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Ticket Perforation Line -->
  <line x1="184" y1="355" x2="616" y2="355" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="160" cy="355" r="14" fill="#0d0f27"/>
  <circle cx="640" cy="355" r="14" fill="#0d0f27"/>
  <!-- Ticket Text -->
  <text x="400" y="216" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="4">MIDNIGHT TIME TRAIN</text>
  <text x="400" y="294" text-anchor="middle" fill="url(#gold)" font-family="sans-serif" font-size="68" font-weight="900" letter-spacing="4">2026 → 2027</text>
  <text x="400" y="332" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">ขบวนรถไฟข้ามปี • ฉีกตั๋ว &amp; เปิดกล่องของขวัญ</text>
  <text x="400" y="394" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">DEPARTURE 23:59  •  FIRST CLASS GIFT</text>
  <!-- Horizon Mountains -->
  <path d="M0 540 L120 485 L250 530 L390 475 L540 528 L680 480 L800 525 L800 600 L0 600 Z" fill="#050712" opacity="0.7"/>
</svg>
