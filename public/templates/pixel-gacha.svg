<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#190e33"/>
      <stop offset="52%" stop-color="#341457"/>
      <stop offset="100%" stop-color="#611e6c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5fb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Pixel stars -->
  <g fill="#fde68a">
    <rect x="96" y="76" width="8" height="8"/><rect x="88" y="84" width="24" height="8"/><rect x="96" y="92" width="8" height="8"/>
    <rect x="688" y="96" width="8" height="8"/><rect x="680" y="104" width="24" height="8"/><rect x="688" y="112" width="8" height="8"/>
    <rect x="172" y="340" width="6" height="6"/><rect x="630" y="310" width="6" height="6"/>
  </g>
  <!-- Pixel hearts -->
  <g fill="#f472b6" opacity="0.75">
    <rect x="148" y="182" width="8" height="8"/><rect x="164" y="182" width="8" height="8"/>
    <rect x="140" y="190" width="40" height="8"/><rect x="148" y="198" width="24" height="8"/><rect x="156" y="206" width="8" height="8"/>
    <rect x="628" y="210" width="8" height="8"/><rect x="644" y="210" width="8" height="8"/>
    <rect x="620" y="218" width="40" height="8"/><rect x="628" y="226" width="24" height="8"/><rect x="636" y="234" width="8" height="8"/>
  </g>
  <!-- Pixel Gachapon Machine -->
  <g transform="translate(274 44)">
    <!-- Top Cap -->
    <rect x="32" y="0" width="188" height="24" fill="#fbbf24" stroke="#2d0f42" stroke-width="6"/>
    <rect x="16" y="24" width="220" height="28" fill="#f472b6" stroke="#2d0f42" stroke-width="6"/>
    <text x="126" y="43" text-anchor="middle" fill="#fff7fb" font-family="monospace" font-size="14" font-weight="900">MEMORY GACHA</text>
    <!-- Glass Dome -->
    <rect x="20" y="52" width="212" height="170" fill="url(#domeGrad)" stroke="#2d0f42" stroke-width="6"/>
    <rect x="34" y="66" width="14" height="64" fill="#ffffff" fill-opacity="0.38"/>
    <!-- Capsules inside dome -->
    <circle cx="72" cy="186" r="24" fill="#f472b6" stroke="#2d0f42" stroke-width="5"/>
    <path d="M48 186h48" stroke="#2d0f42" stroke-width="4"/>
    <circle cx="122" cy="190" r="24" fill="#60a5fa" stroke="#2d0f42" stroke-width="5"/>
    <path d="M98 190h48" stroke="#2d0f42" stroke-width="4"/>
    <circle cx="176" cy="186" r="24" fill="#fbbf24" stroke="#2d0f42" stroke-width="5"/>
    <path d="M152 186h48" stroke="#2d0f42" stroke-width="4"/>
    <circle cx="96" cy="144" r="24" fill="#c084fc" stroke="#2d0f42" stroke-width="5"/>
    <path d="M72 144h48" stroke="#2d0f42" stroke-width="4"/>
    <circle cx="150" cy="144" r="24" fill="#34d399" stroke="#2d0f42" stroke-width="5"/>
    <path d="M126 144h48" stroke="#2d0f42" stroke-width="4"/>
    <circle cx="124" cy="104" r="22" fill="#fb7185" stroke="#2d0f42" stroke-width="5"/>
    <path d="M102 104h44" stroke="#2d0f42" stroke-width="4"/>
    <!-- Machine Body -->
    <rect x="12" y="222" width="228" height="168" fill="url(#bodyGrad)" stroke="#2d0f42" stroke-width="6"/>
    <!-- Rotary Crank -->
    <circle cx="126" cy="284" r="34" fill="#fff1f2" stroke="#2d0f42" stroke-width="6"/>
    <rect x="96" y="276" width="60" height="16" fill="#fbbf24" stroke="#2d0f42" stroke-width="4"/>
    <!-- Dispenser Tray -->
    <rect x="44" y="332" width="164" height="42" fill="#2d0f42" stroke="#1b0929" stroke-width="4"/>
    <circle cx="126" cy="353" r="14" fill="#fde047" stroke="#ffffff" stroke-width="3"/>
    <!-- Base -->
    <rect x="0" y="390" width="252" height="22" fill="#be185d" stroke="#2d0f42" stroke-width="6"/>
  </g>
</svg>

