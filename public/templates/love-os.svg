<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#3b1254"/>
      <stop offset="100%" stop-color="#7c1d6f"/>
    </linearGradient>
    <linearGradient id="winBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="btnYes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#f9a8d4" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M160 0V500M320 0V500M480 0V500M640 0V500"/>
  </g>
  <circle cx="150" cy="110" r="90" fill="#ec4899" opacity="0.22" filter="url(#glow)"/>
  <circle cx="670" cy="370" r="110" fill="#a855f7" opacity="0.24" filter="url(#glow)"/>
  <!-- Desktop File Icon -->
  <g transform="translate(88 128)">
    <rect x="0" y="0" width="76" height="84" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#f9a8d4" stroke-opacity="0.45"/>
    <path d="M38 56c-1.2 0-16-9.5-16-20.2 0-5.4 4.2-9.8 9.4-9.8 3.2 0 5.6 1.6 6.6 3.7 1-2.1 3.4-3.7 6.6-3.7 5.2 0 9.4 4.4 9.4 9.8C54 46.5 39.2 56 38 56z" fill="#f472b6"/>
    <text x="38" y="104" text-anchor="middle" fill="#fce7f3" font-family="sans-serif" font-size="13" font-weight="700">For_You.love</text>
  </g>
  <!-- Center Love Error Window -->
  <g transform="translate(215 110)">
    <rect width="420" height="250" rx="18" fill="#180d29" fill-opacity="0.92" stroke="#f9a8d4" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="2" y="2" width="416" height="40" rx="16" fill="url(#winBar)"/>
    <circle cx="24" cy="22" r="6" fill="#fff1f2"/>
    <circle cx="44" cy="22" r="6" fill="#fef08a"/>
    <circle cx="64" cy="22" r="6" fill="#bbf7d0"/>
    <text x="86" y="27" fill="#1e0b2e" font-family="monospace" font-size="14" font-weight="800">LOVE_OS // SYSTEM ALERT</text>
    <circle cx="82" cy="122" r="32" fill="#ec4899" fill-opacity="0.2" stroke="#f472b6" stroke-width="2"/>
    <path d="M82 135c-1 0-14-8.2-14-17.4 0-4.6 3.6-8.4 8-8.4 2.8 0 4.8 1.4 6 3.2 1.2-1.8 3.2-3.2 6-3.2 4.4 0 8 3.8 8 8.4C96 126.8 83 135 82 135z" fill="#f472b6"/>
    <text x="132" y="112" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">Love Overflow Detected</text>
    <text x="132" y="138" fill="#f5d0fe" font-family="sans-serif" font-size="14">Open this secret file right now?</text>
    <rect x="132" y="176" width="122" height="42" rx="12" fill="url(#btnYes)"/>
    <text x="193" y="202" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">YES</text>
    <rect x="274" y="176" width="110" height="42" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#f9a8d4" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <text x="329" y="202" text-anchor="middle" fill="#fbcfe8" font-family="sans-serif" font-size="14" font-weight="700">Cancel</text>
  </g>
  <!-- Taskbar -->
  <rect x="0" y="452" width="800" height="48" fill="#12071f" fill-opacity="0.9"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#f472b6" stroke-opacity="0.35"/>
  <rect x="18" y="462" width="96" height="28" rx="9" fill="url(#btnYes)"/>
  <text x="66" y="481" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">Love OS</text>
</svg>

