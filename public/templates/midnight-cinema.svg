<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Cinzel:wght@600;800;900&amp;family=Prompt:wght@400;600&amp;display=swap');
    </style>
    <radialGradient id="spotlightBeam" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fff1cc" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticketPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#ebe6da"/>
    </linearGradient>
    <filter id="ticketShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Charcoal Background -->
  <rect width="480" height="720" fill="#090a0f"/>

  <!-- Overhead Spotlight Beam -->
  <rect width="480" height="720" fill="url(#spotlightBeam)"/>

  <!-- Dust Motes / Particles -->
  <circle cx="120" cy="80" r="1.5" fill="#fef3c7" opacity="0.6"/>
  <circle cx="360" cy="110" r="2" fill="#fef3c7" opacity="0.7"/>
  <circle cx="210" cy="190" r="1" fill="#fef3c7" opacity="0.4"/>
  <circle cx="80" cy="380" r="1.5" fill="#fef3c7" opacity="0.5"/>
  <circle cx="410" cy="450" r="2" fill="#fef3c7" opacity="0.6"/>
  <circle cx="240" cy="620" r="1.5" fill="#fef3c7" opacity="0.4"/>

  <!-- Top Title / Header -->
  <text x="240" y="65" text-anchor="middle" fill="#d97706" font-family="'Cinzel', serif" font-weight="800" font-size="12" letter-spacing="4">NOIR PICTURES ARCHIVE</text>
  <text x="240" y="88" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-weight="900" font-size="20" letter-spacing="3">MIDNIGHT CINEMA</text>
  <text x="240" y="108" text-anchor="middle" fill="#9ca3af" font-family="'Prompt', sans-serif" font-size="11">35mm Classic Film Edition</text>

  <!-- 35mm Cinema Ticket Stub -->
  <g transform="translate(45, 140)" filter="url(#ticketShadow)">
    <!-- Ticket Body Base -->
    <rect width="390" height="190" rx="14" fill="url(#ticketPaper)" stroke="#d4cbba" stroke-width="1.5"/>

    <!-- Left Perforation Semi-circle notches -->
    <circle cx="110" cy="0" r="10" fill="#090a0f"/>
    <circle cx="110" cy="190" r="10" fill="#090a0f"/>

    <!-- Dashed Perforation Line -->
    <line x1="110" y1="12" x2="110" y2="178" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Left Stub Info -->
    <text x="25" y="40" fill="#6b7280" font-family="'Courier Prime', monospace" font-size="8" letter-spacing="2">STUB #35MM</text>
    <text x="25" y="65" fill="#111827" font-family="'Courier Prime', monospace" font-weight="700" font-size="12">SCREEN 01</text>
    <text x="25" y="85" fill="#991b1b" font-family="'Courier Prime', monospace" font-weight="700" font-size="11">ROW A - 07</text>
    
    <text x="25" y="120" fill="#6b7280" font-family="'Courier Prime', monospace" font-size="7">DATE: 14 FEB</text>
    <text x="25" y="132" fill="#6b7280" font-family="'Courier Prime', monospace" font-size="7">TIME: 23:45</text>
    
    <text x="60" y="165" text-anchor="middle" fill="#111827" font-family="'Cinzel', serif" font-weight="800" font-size="9" letter-spacing="1">ADMIT ONE</text>

    <!-- Right Main Ticket Content -->
    <text x="135" y="40" fill="#6b7280" font-family="'Courier Prime', monospace" font-size="8" letter-spacing="2">EXCLUSIVE SCREENING</text>
    <rect x="330" y="28" width="38" height="16" rx="3" fill="#111827"/>
    <text x="349" y="40" text-anchor="middle" fill="#fef3c7" font-family="'Courier Prime', monospace" font-weight="700" font-size="9">35MM</text>

    <text x="245" y="75" text-anchor="middle" fill="#92400e" font-family="'Courier Prime', monospace" font-size="9" letter-spacing="3">NOW SHOWING</text>
    <text x="245" y="105" text-anchor="middle" fill="#111827" font-family="'Cinzel', serif" font-weight="900" font-size="18" letter-spacing="1">THE STORY OF US</text>
    <text x="245" y="125" text-anchor="middle" fill="#4b5563" font-family="'Courier Prime', monospace" font-size="9">DIRECTED BY YOU &amp; ME</text>

    <!-- Barcode -->
    <g transform="translate(135, 142)">
      <rect x="0" y="0" width="3" height="24" fill="#111827"/>
      <rect x="5" y="0" width="1" height="24" fill="#111827"/>
      <rect x="8" y="0" width="4" height="24" fill="#111827"/>
      <rect x="14" y="0" width="2" height="24" fill="#111827"/>
      <rect x="18" y="0" width="1" height="24" fill="#111827"/>
      <rect x="22" y="0" width="3" height="24" fill="#111827"/>
      <rect x="27" y="0" width="5" height="24" fill="#111827"/>
      <rect x="34" y="0" width="2" height="24" fill="#111827"/>
      <rect x="38" y="0" width="1" height="24" fill="#111827"/>
      <rect x="42" y="0" width="4" height="24" fill="#111827"/>
      <rect x="48" y="0" width="2" height="24" fill="#111827"/>
      <rect x="53" y="0" width="3" height="24" fill="#111827"/>
      <rect x="58" y="0" width="1" height="24" fill="#111827"/>
      <rect x="62" y="0" width="4" height="24" fill="#111827"/>
      <rect x="68" y="0" width="2" height="24" fill="#111827"/>
      <rect x="73" y="0" width="3" height="24" fill="#111827"/>
      <rect x="78" y="0" width="5" height="24" fill="#111827"/>
      <rect x="85" y="0" width="2" height="24" fill="#111827"/>
      <rect x="90" y="0" width="1" height="24" fill="#111827"/>
      <rect x="93" y="0" width="4" height="24" fill="#111827"/>
      <rect x="100" y="0" width="2" height="24" fill="#111827"/>
      <rect x="104" y="0" width="3" height="24" fill="#111827"/>
      <rect x="110" y="0" width="4" height="24" fill="#111827"/>
      <rect x="116" y="0" width="2" height="24" fill="#111827"/>
    </g>

    <text x="350" y="160" text-anchor="end" fill="#111827" font-family="'Cinzel', serif" font-weight="900" font-size="11">ADMIT ONE</text>
  </g>

  <!-- 35mm Film Ribbon Graphic -->
  <g transform="translate(45, 360)">
    <!-- Film Ribbon Outer Box -->
    <rect width="390" height="210" rx="10" fill="#050608" stroke="#262626" stroke-width="1.5"/>

    <!-- Top Sprockets -->
    <g transform="translate(15, 8)">
      <rect x="0" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="25" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="50" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="75" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="100" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="125" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="150" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="175" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="200" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="225" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="250" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="275" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="300" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="325" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="350" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
    </g>

    <!-- Film Frame #01 -->
    <g transform="translate(15, 30)">
      <rect width="170" height="150" rx="4" fill="#18181b" stroke="#3f3f46"/>
      <!-- Inner Cinema Screen Placeholder -->
      <rect x="6" y="6" width="158" height="105" rx="3" fill="#27272a"/>
      <circle cx="85" cy="58" r="22" fill="#3f3f46" opacity="0.6"/>
      <text x="14" y="24" fill="#fef3c7" font-family="'Courier Prime', monospace" font-weight="700" font-size="10">#01</text>
      <text x="85" y="128" text-anchor="middle" fill="#d4d4d8" font-family="'Courier Prime', monospace" font-size="8">SCENE 01: THE ENCOUNTER</text>
      <text x="85" y="140" text-anchor="middle" fill="#71717a" font-family="'Prompt', sans-serif" font-size="7">ค่ำคืนแรกที่เราได้พบกัน</text>
    </g>

    <!-- Film Frame #02 -->
    <g transform="translate(205, 30)">
      <rect width="170" height="150" rx="4" fill="#18181b" stroke="#3f3f46"/>
      <rect x="6" y="6" width="158" height="105" rx="3" fill="#27272a"/>
      <circle cx="85" cy="58" r="22" fill="#3f3f46" opacity="0.6"/>
      <text x="14" y="24" fill="#fef3c7" font-family="'Courier Prime', monospace" font-weight="700" font-size="10">#02</text>
      <text x="85" y="128" text-anchor="middle" fill="#d4d4d8" font-family="'Courier Prime', monospace" font-size="8">SCENE 02: THE JOURNEY</text>
      <text x="85" y="140" text-anchor="middle" fill="#71717a" font-family="'Prompt', sans-serif" font-size="7">ภาพยนตร์เรื่องโปรดของเรา</text>
    </g>

    <!-- Bottom Sprockets -->
    <g transform="translate(15, 188)">
      <rect x="0" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="25" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="50" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="75" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="100" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="125" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="150" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="175" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="200" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="225" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="250" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="275" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="300" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="325" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
      <rect x="350" y="0" width="10" height="14" rx="2" fill="#090a0f" stroke="#404040"/>
    </g>
  </g>

  <!-- Bottom Badge / Label -->
  <g transform="translate(180, 600)">
    <rect width="120" height="28" rx="14" fill="#1f1508" stroke="#d97706" stroke-width="1"/>
    <text x="60" y="18" text-anchor="middle" fill="#fef3c7" font-family="'Cinzel', serif" font-weight="800" font-size="10" letter-spacing="2">CINEMATIC</text>
  </g>

  <!-- Footer Credits -->
  <text x="240" y="650" text-anchor="middle" fill="#52525b" font-family="'Courier Prime', monospace" font-size="9">SURPRISEQR CINEMA COLLECTION • 2026</text>
</svg>

