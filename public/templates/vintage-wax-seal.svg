<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Prompt:wght@400;600&amp;display=swap');
    </style>
    <radialGradient id="candlelight" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#80152b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#2a050e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#120206"/>
    </radialGradient>
    <radialGradient id="envelopeGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5ecdc"/>
    </radialGradient>
    <radialGradient id="waxRuby" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#991b1b"/>
      <stop offset="85%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f0202"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Burgundy Velvet Background -->
  <rect width="480" height="720" fill="#120206"/>
  <rect width="480" height="720" fill="url(#candlelight)"/>

  <!-- Golden Floating Dust Sparkles -->
  <circle cx="80" cy="140" r="2.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="390" cy="180" r="3" fill="#ffe066" opacity="0.8"/>
  <circle cx="120" cy="560" r="2" fill="#ffd700" opacity="0.6"/>
  <circle cx="420" cy="520" r="3.5" fill="#fef08a" opacity="0.85"/>
  <circle cx="240" cy="80" r="2.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="60" cy="380" r="2" fill="#fef08a" opacity="0.5"/>
  <circle cx="410" cy="340" r="2.5" fill="#ffd700" opacity="0.75"/>

  <!-- Header Banner -->
  <text x="240" y="70" text-anchor="middle" fill="#d4af37" font-family="'Playfair Display', serif" font-size="12" letter-spacing="4">ROYAL VINTAGE PARCHMENT</text>
  <text x="240" y="92" text-anchor="middle" fill="#fef08a" font-family="'Prompt', sans-serif" font-size="11" opacity="0.8">หรูหรา สง่างาม ระดับพรีเมียม</text>

  <!-- Parchment Envelope Main Body -->
  <g transform="translate(48, 140)" filter="url(#shadow)">
    <!-- Envelope Base Card -->
    <rect width="384" height="280" rx="16" fill="url(#envelopeGrad)" stroke="#d4af37" stroke-width="2.5"/>

    <!-- Inner Filigree Border -->
    <rect x="12" y="12" width="360" height="256" rx="10" fill="none" stroke="#c5a059" stroke-width="1" stroke-dasharray="6 3" opacity="0.7"/>

    <!-- Corner Filigrees -->
    <text x="24" y="32" fill="#996515" font-size="16">❦</text>
    <text x="360" y="32" text-anchor="end" fill="#996515" font-size="16">❦</text>
    <text x="24" y="256" fill="#996515" font-size="16">❦</text>
    <text x="360" y="256" text-anchor="end" fill="#996515" font-size="16">❦</text>

    <!-- Flap Lines -->
    <path d="M 12 12 L 192 140 L 372 12" fill="none" stroke="#d4af37" stroke-width="1.8" opacity="0.45"/>

    <!-- Title Calligraphy -->
    <text x="192" y="85" text-anchor="middle" fill="#996515" font-family="'Playfair Display', serif" font-size="11" letter-spacing="3" font-weight="600">SEALED WITH LOVE</text>
    <text x="192" y="118" text-anchor="middle" fill="#4a0e17" font-family="'Playfair Display', serif" font-size="24" font-weight="bold">To Someone Special</text>
    <text x="192" y="140" text-anchor="middle" fill="#78350f" font-family="'Prompt', sans-serif" font-size="11">แตะตราครั่งเพื่อเปิดผนึกความในใจ</text>

    <!-- 3D Ruby Red Wax Seal -->
    <g transform="translate(192, 210)">
      <!-- Wax Outer Ambient Shadow -->
      <circle cx="0" cy="6" r="42" fill="#25020c" opacity="0.5"/>

      <!-- Organic Wax Dripped Border (Circle + blobs) -->
      <path d="M 0 -44 C 18 -46, 38 -32, 44 -14 C 50 4, 46 26, 38 38 C 26 50, 4 48, -10 46 C -28 44, -46 36, -46 16 C -46 -4, -36 -24, -22 -36 C -12 -44, -6 -42, 0 -44 Z" fill="url(#waxRuby)"/>

      <!-- Inner Raised Ring -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="25" fill="#700f28" stroke="#3a0312" stroke-width="1.8"/>

      <!-- Specular Highlight Arc -->
      <path d="M -16 -12 A 20 20 0 0 1 16 -12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

      <!-- Embossed Heart/Floral Symbol in Center -->
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-size="22" opacity="0.95">❦</text>
    </g>
  </g>

  <!-- Lower Parchment Letter Preview Card -->
  <g transform="translate(64, 460)" filter="url(#shadow)">
    <!-- Unfolded Letter Preview -->
    <rect width="352" height="190" rx="14" fill="#faf5ea" stroke="#d4af37" stroke-width="2"/>
    <rect x="8" y="8" width="336" height="174" rx="8" fill="none" stroke="#c5a059" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.5"/>

    <!-- Letter Calligraphy & Text Lines -->
    <text x="176" y="38" text-anchor="middle" fill="#4a0e17" font-family="'Playfair Display', serif" font-size="16" font-weight="bold">Dearest Beloved ❦</text>
    <line x1="40" y1="52" x2="312" y2="52" stroke="#d4af37" stroke-width="1" opacity="0.3"/>

    <text x="176" y="78" text-anchor="middle" fill="#3e2723" font-family="'Prompt', sans-serif" font-size="11">ทุกช่วงเวลาที่ได้ร่วมเดินทางด้วยกัน...</text>
    <text x="176" y="100" text-anchor="middle" fill="#3e2723" font-family="'Prompt', sans-serif" font-size="11">คือความทรงจำที่ล้ำค่าประหนึ่งทองคำ</text>
    <text x="176" y="122" text-anchor="middle" fill="#78350f" font-family="'Prompt', sans-serif" font-size="11" font-style="italic">พร้อมเครื่องเล่นกล่องดนตรีไขลาน ♫</text>

    <!-- Mini Golden Music Box Pill -->
    <g transform="translate(106, 142)">
      <rect width="140" height="28" rx="14" fill="#4a0e17" stroke="#d4af37" stroke-width="1.2"/>
      <text x="70" y="18" text-anchor="middle" fill="#fef08a" font-family="'Prompt', sans-serif" font-size="11" font-weight="600">♫ Music Box Player</text>
    </g>
  </g>

  <!-- Luxury Footer Badge -->
  <text x="240" y="690" text-anchor="middle" fill="#c5a059" font-family="'Playfair Display', serif" font-size="11" letter-spacing="2">✦ VINTAGE WAX SEAL &amp; ROYAL PARCHMENT ✦</text>
</svg>

